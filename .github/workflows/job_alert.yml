name: AI/ML Job Alert Pipeline

on:
  schedule:
    # 4x daily: 00:30, 06:30, 12:30, 18:30 UTC = 06:00, 12:00, 18:00, 00:00 IST
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:   # Manual trigger with optional dry-run toggle
    inputs:
      dry_run:
        description: 'Run in Dry Run mode (no Telegram notifications or DB mutations)'
        required: false
        default: 'false'
        type: string

jobs:
  run-job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Code Checkout ──────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Set Up Python Environment ──────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Restore & Save SQLite DB Cache ─────────────────────────────────
      - name: Restore SQLite State Database
        uses: actions/cache@v4
        with:
          path: data/
          # Key: unique per run_id so GitHub Actions always saves updated state
          key: jobs-db-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-v2-${{ runner.os }}-

      # ── 4. Ensure Runtime Directories Exist ───────────────────────────────
      - name: Create Runtime Directories
        run: |
          mkdir -p data logs reports output

      # ── 5. Install Dependencies ───────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Run Test Suite (RequestGuard & StateLedger Verification) ───────
      - name: Run Test Suite
        run: |
          pytest tests/ -v

      # ── 7. Execute Ingestion & Deduplication Pipeline ─────────────────────
      - name: Run Job Alert Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ON_EMPTY: "false"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python main.py

      # ── 8. Upload Reports & Logs as Artifacts ──────────────────────────────
      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 14
          if-no-files-found: ignore
